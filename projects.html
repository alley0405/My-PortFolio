<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Yuvraj Singh</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style1.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

  <style>
    #bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1), transparent 40%),
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px;
    }

    .project-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--secondary);
      font-weight: 600;
      margin-right: 0.5rem;
    }
  </style>
</head>

<body>
  <div id="bg"></div>
  <div class="blob-container">
    <div class="blob"></div>
    <div class="blob secondary"></div>
  </div>

  <!-- TOP NAVBAR (Apple Dock Style) -->
  <nav class="NavBar">
    <ul>
      <li>
        <a href="index.html">
          <i data-lucide="home"></i>
          <span class="label">Home</span>
        </a>
      </li>
      <li>
        <a href="index.html#skills-section">
          <i data-lucide="zap"></i>
          <span class="label">Skills</span>
        </a>
      </li>
      <li>
        <a href="achievements.html">
          <i data-lucide="award"></i>
          <span class="label">Achievements</span>
        </a>
      </li>
      <li>
        <a href="projects.html" class="active">
          <i data-lucide="briefcase"></i>
          <span class="label">Projects</span>
        </a>
      </li>
      <li>
        <a href="contact.html">
          <i data-lucide="mail"></i>
          <span class="label">Contact</span>
        </a>
      </li>
    </ul>
  </nav>

  <main class="container section-padding fade-in-up">
    <header class="text-center mb-16">
      <h1 class="hero-text text-gradient">Featured Projects</h1>
      <p class="text-muted max-w-xl mx-auto">A collection of technical solutions built with passion and precision.</p>
    </header>

    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Dynamic Projects will be injected here -->
      <div class="col-span-full py-20 text-center text-muted">Loading projects from database...</div>
    </div>
  </main>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // -- Fetch Projects from Django API --
    async function fetchProjects() {
      const grid = document.getElementById('projects-grid');
      try {
        const response = await fetch('http://localhost:8000/api/projects/');
        const projects = await response.json();
        
        if (projects.length > 0) {
          grid.innerHTML = ''; // Clear loading state
          projects.forEach((proj, index) => {
            const card = document.createElement('div');
            card.className = 'card-premium fade-in-up';
            card.style.animationDelay = `${index * 0.1}s`;
            
            const tagsHtml = proj.tags.split(',').map(tag => `<span class="project-tag">${tag}</span>`).join('');
            
            // Format descriptions (bullet points if start with -)
            const descLines = proj.description.split('\n');
            let descHtml = '';
            if (descLines.some(l => l.trim().startsWith('-'))) {
               descHtml = `<ul class="text-muted text-sm space-y-2 list-disc pl-4" style="text-align: left;">
                 ${descLines.map(line => line.trim().startsWith('-') ? `<li>${line.trim().substring(1).trim()}</li>` : `<li>${line.trim()}</li>`).join('')}
               </ul>`;
            } else {
               descHtml = `<p class="text-muted text-sm mb-6">${proj.description}</p>`;
            }

            card.innerHTML = `
              <h3 class="text-xl font-bold mb-2">${proj.title}</h3>
              <p class="text-accent text-sm mb-4">${proj.subtitle}</p>
              <div class="flex mb-4 gap-2">${tagsHtml}</div>
              ${descHtml}
              ${proj.doc_link ? `<a href="${proj.doc_link}" class="btn-premium mt-6" style="padding: 0.5rem 1.25rem; font-size: 0.85rem; display: inline-block;">Documentation</a>` : ''}
            `;
            grid.appendChild(card);
          });
          // Re-trigger icon creation for any new icons if needed
          lucide.createIcons();
        } else {
          grid.innerHTML = '<div class="col-span-full text-center py-20 text-muted">No projects found in database.</div>';
        }
      } catch (error) {
        console.error('Error fetching projects:', error);
        grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Failed to connect to database API. Ensure Django server is running.</div>';
      }
    }
    fetchProjects();

    // -- Custom Spring Cursor --
    if (window.matchMedia("(pointer: fine)").matches) {
      const dot = document.createElement('div'); dot.className = 'cursor-dot';
      const ring = document.createElement('div'); ring.className = 'cursor-ring';
      document.body.appendChild(dot);
      document.body.appendChild(ring);
      
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let dotX = mouseX, dotY = mouseY;
      let ringX = mouseX, ringY = mouseY;
      
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; 
        mouseY = e.clientY;
      });
      
      const renderCursor = () => {
        dotX += (mouseX - dotX) * 0.8;
        dotY += (mouseY - dotY) * 0.8;
        ringX += (mouseX - ringX) * 0.15;
        ringY += (mouseY - ringY) * 0.15;
        
        dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;
        ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
        requestAnimationFrame(renderCursor);
      };
      renderCursor();

      document.querySelectorAll('a, button, .card-premium').forEach(el => {
        el.addEventListener('mouseenter', () => {
          ring.style.width = '50px';
          ring.style.height = '50px';
          ring.style.background = 'rgba(139, 92, 246, 0.1)';
        });
        el.addEventListener('mouseleave', () => {
          ring.style.width = '32px';
          ring.style.height = '32px';
          ring.style.background = 'transparent';
        });
      });
    }

    // -- Navbar Scroll Effect --
    const nav = document.querySelector('.NavBar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });

    // -- Navbar Dock Magnification --
    const initDock = () => {
      const dockItems = document.querySelectorAll('.NavBar a');
      const BASE_SIZE = 44; 
      const MAX_SIZE = 70;
      const DISTANCE_THRESHOLD = 150;

      if (nav) {
        window.addEventListener('mousemove', (e) => {
          const navRect = nav.getBoundingClientRect();
          if (e.clientY > navRect.top - 100 && e.clientY < navRect.bottom + 100) {
            dockItems.forEach((item) => {
              const rect = item.getBoundingClientRect();
              const itemCenterX = rect.left + rect.width / 2;
              const distance = Math.abs(e.clientX - itemCenterX);
              let newWidth = BASE_SIZE;
              if (distance < DISTANCE_THRESHOLD) {
                const scale = 1 - (distance / DISTANCE_THRESHOLD);
                newWidth = BASE_SIZE + (MAX_SIZE - BASE_SIZE) * Math.sin(scale * Math.PI / 2);
              }
              item.style.width = `${newWidth}px`;
              item.style.height = `${newWidth}px`;
            });
          } else {
            dockItems.forEach(i => { i.style.width = `${BASE_SIZE}px`; i.style.height = `${BASE_SIZE}px`; });
          }
        });
      }
    };
    initDock();

    // Initialize Premium Lenis Full-Page Smooth Scroller
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), 
      smooth: true,
      mouseMultiplier: 1,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  </script>
</body>
</html>
